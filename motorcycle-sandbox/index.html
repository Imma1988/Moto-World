<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Sandbox - Fase 1</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map para resolver dependências sem bundler -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/rapier3d-compat.module.js"
        }
    }
    </script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #ff9800; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #hud {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-size: 14px; text-shadow: 1px 1px 2px #000; pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Ecrã de Carregamento -->
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">A carregar motor de física...</div>
    </div>

    <!-- HUD Básico -->
    <div id="hud">
        <div>Velocidade: <span id="speed-value">0</span> km/h</div>
        <div>Estado: <span id="state-value">Normal</span></div>
        <div style="margin-top:5px; font-size: 12px; color: #aaa;">WASD: Conduzir | R: Reset | Espaço: Travão</div>
    </div>

    <!-- Ponto de entrada da aplicação -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
