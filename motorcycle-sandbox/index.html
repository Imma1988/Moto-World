<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Sandbox - Fase 1</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; display: block; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none;
            display: none;
        }
        .hud-item { margin-bottom: 5px; }
        #controls-hint {
            position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7);
            font-size: 14px; pointer-events: none;
        }
    </style>
    
    <!-- Import Map Corrigido -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "rapier3d": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d@0.14.0/esm/rapier3d.js"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">A carregar motor de física...</div>
    </div>

    <div id="hud">
        <div class="hud-item">Velocidade: <span id="speed-value">0</span> km/h</div>
        <div class="hud-item">Estado: <span id="state-value">Normal</span></div>
    </div>

    <div id="controls-hint">
        W/S: Acelerar/Travar | A/D: Virar | ESPAÇO: Travão Mão | R: Reset
    </div>

    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import RAPIER from 'rapier3d';

        // Inicialização assíncrona do Rapier
        async function init() {
            await RAPIER.init();
            
            // Expor RAPIER globalmente para outros módulos usarem antes do bundle completo
            window.RAPIER = RAPIER;
            
            // Agora importa o jogo principal
            const { Game } = await import('./src/core/Game.js');
            const game = new Game();
            game.start();
            
            // Esconder loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('hud').style.display = 'block';
            }, 500);
        }

        init().catch(err => {
            console.error("Erro fatal:", err);
            document.getElementById('loading-text').innerText = "Erro ao carregar: " + err.message;
        });
    </script>
</body>
</html>
